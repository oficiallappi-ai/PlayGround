<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101c28" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />
  <title>Avatar: The Four Elements — A Living World</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Four Elements home"><span class="brand-mark">✦</span><span>FOUR <b>ELEMENTS</b></span></a>
      <div class="world-meta"><span class="live-dot"></span><span id="regionName">SOUTHERN WATER TRIBE</span><i>·</i><span id="clock">DAY 01 · MORNING</span></div>
      <button class="icon-button" id="soundButton" aria-label="Toggle sound">♫ <span>Sound</span></button>
    </header>
    <main class="game-layout">
      <section class="play-column">
        <div class="scene-frame">
          <canvas id="world" aria-label="Explore the Four Nations"></canvas>
          <div class="scene-vignette"></div>
          <div class="scene-topline"><span class="location-tag"><span>⌖</span> <b id="locationLabel">FROSTFALL VILLAGE</b></span><span class="weather-tag" id="weather">❄ &nbsp; LIGHT SNOW</span></div>
          <div class="toast" id="toast"></div>
          <div class="scene-hint" id="sceneHint">WASD / ARROWS <span>MOVE</span><i>·</i> E <span>INTERACT</span></div>
          <div class="mobile-pad" id="mobilePad" aria-label="Touch movement">
            <button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
          </div>
          <div class="mobile-actions"><button id="touchInteract">TALK</button><button id="touchAction">ACT</button></div>
        </div>
        <div class="action-dock">
          <div class="character-chip"><div class="portrait" id="portrait">✦</div><div><span class="eyebrow" id="heroTitle">WANDERER · AGE 16</span><strong id="heroName">A new story</strong></div></div>
          <div class="vitals"><div class="vital-row"><span>VITALITY</span><div class="meter"><i id="healthBar"></i></div><b id="healthText">100 / 100</b></div><div class="vital-row"><span>FOCUS</span><div class="meter focus"><i id="focusBar"></i></div><b id="focusText">60 / 60</b></div></div>
          <div class="dock-actions"><button class="action-key" id="meditateButton"><kbd>Q</kbd><span>ATTUNE</span></button><button class="action-key" id="mapButton"><kbd>M</kbd><span>WORLD</span></button></div>
        </div>
        <div class="mobile-tabs"><button data-panel="journal">JOURNAL</button><button data-panel="character">HERO</button><button data-panel="map">WORLD</button><button data-panel="skills">SKILLS</button></div>
      </section>
      <aside class="side-panel">
        <div class="panel-tabs"><button class="tab active" data-tab="journal">JOURNAL</button><button class="tab" data-tab="character">HERO</button><button class="tab" data-tab="skills">MASTERY</button></div>
        <div class="panel-content" id="panelContent"></div>
        <div class="side-footer"><span class="save-dot"></span> YOUR JOURNEY SAVES AS YOU PLAY</div>
      </aside>
    </main>
    <footer class="bottomline"><span>A WORLD OF YOUR OWN MAKING</span><span>WASD MOVE <i>·</i> E INTERACT <i>·</i> SPACE TECHNIQUE <i>·</i> ESC CLOSE</span></footer>
  </div>
  <div class="overlay" id="overlay"></div>
  <script src="game.js"></script>
</body>
</html>
